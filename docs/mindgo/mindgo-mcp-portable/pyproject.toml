[project]
name = "supermind-mcp"
version = "0.1.0"
description = "MCP server for running code and moving files against a remote Jupyter server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Supermind MCP contributors" }]
dependencies = [
    "certifi>=2024.2.2",
    "httpx>=0.27.0",
    "mcp>=1.9.0",
    "pathspec>=0.12.1",
    "pydantic>=2.7.0",
    "websockets>=12.0",
]

[project.scripts]
supermind-mcp = "supermind_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
