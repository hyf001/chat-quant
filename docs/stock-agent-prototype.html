<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat-Quant 股票智能体工作台原型</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #172033;
      --muted: #667085;
      --line: #dce3ec;
      --line-strong: #c5d0df;
      --brand: #1f7a6d;
      --brand-2: #2451a6;
      --accent: #c26a2d;
      --danger: #c0392b;
      --good: #11875d;
      --warn: #ad6a00;
      --shadow: 0 16px 48px rgba(38, 52, 77, 0.12);
      --radius: 8px;
      --sidebar: 292px;
      --insight: 360px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72), rgba(245,247,251,0.95)),
        radial-gradient(circle at 18% 10%, rgba(31,122,109,0.12), transparent 28%),
        radial-gradient(circle at 84% 6%, rgba(36,81,166,0.10), transparent 30%),
        var(--bg);
      color: var(--ink);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(420px, 1fr) var(--insight);
      min-height: 100vh;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.86);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .brand-row,
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: 0 8px 22px rgba(31,122,109,0.24);
      flex: 0 0 auto;
    }

    .logo-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logo-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--ink);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: #fff;
    }

    .new-chat {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 760;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .input-shell textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: 0;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .input-shell textarea:focus,
    .param-grid input:focus,
    .param-grid select:focus,
    .ask-note textarea:focus {
      border-color: rgba(31,122,109,0.72);
      box-shadow: 0 0 0 3px rgba(31,122,109,0.12);
    }

    .conversation-count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
      padding: 2px 2px 0;
    }

    .session-list {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }

    .session-item {
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 5px;
      color: var(--ink);
      transition: background .18s ease, border-color .18s ease;
    }

    .session-item:hover {
      background: #fff;
      border-color: var(--line);
    }

    .session-item.active {
      background: #fff;
      border-color: #b7d9d3;
      box-shadow: 0 8px 22px rgba(31,122,109,0.10);
    }

    .session-primary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: baseline;
    }

    .session-title {
      font-size: 13px;
      font-weight: 760;
      line-height: 1.32;
      overflow-wrap: anywhere;
    }

    .session-time {
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      white-space: nowrap;
    }

    .session-snippet {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .session-meta,
    .tiny-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 17px;
      display: inline-flex;
      align-items: center;
      max-width: 100%;
    }

    .tag.strategy {
      background: #ecf7f4;
      border-color: #bfe1d9;
      color: #17685e;
    }

    .tag.compare {
      background: #eef3ff;
      border-color: #c9d8ff;
      color: #284f9e;
    }

    .tag.warn {
      background: #fff7e6;
      border-color: #f2d59a;
      color: #8b5300;
    }

    .tag.good {
      background: #eaf7ef;
      border-color: #bfe4cd;
      color: #117246;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      max-height: 100vh;
    }

    .topbar {
      min-height: 68px;
      padding: 14px 20px;
      background: rgba(245, 247, 251, 0.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .mobile-menu {
      display: none;
    }

    .title-block {
      min-width: 0;
    }

    .page-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.22;
      font-weight: 850;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .page-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--good);
      box-shadow: 0 0 0 4px rgba(17,135,93,0.12);
    }

    .chat-scroll {
      overflow: auto;
      padding: 22px 20px 220px;
      flex: 1;
      scroll-behavior: smooth;
    }

    .thread {
      width: min(900px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .message {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 850;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--brand);
    }

    .message.user .avatar {
      color: #fff;
      background: var(--brand-2);
      border-color: var(--brand-2);
    }

    .bubble {
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 8px 22px rgba(38,52,77,0.06);
      min-width: 0;
    }

    .message.user .bubble {
      background: #f3f7ff;
      border-color: #cad8f5;
      box-shadow: none;
    }

    .bubble p {
      margin: 0;
      line-height: 1.62;
      font-size: 14px;
    }

    .bubble p + p {
      margin-top: 8px;
    }

    .bubble-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .bubble-title {
      font-size: 14px;
      font-weight: 820;
      line-height: 1.35;
    }

    .bubble-time {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      margin-top: 2px;
    }

    .assumption-grid {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin: 13px 0;
    }

    .assumption {
      background: var(--panel-soft);
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .assumption:last-child {
      border-bottom: 0;
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 5px;
    }

    .value {
      font-size: 13px;
      font-weight: 760;
      line-height: 1.32;
      overflow-wrap: anywhere;
    }

    .ask-card {
      border: 1px solid #b9ded6;
      background: #f2faf7;
      border-radius: 8px;
      padding: 12px;
      margin-top: 13px;
      display: grid;
      gap: 12px;
    }

    .ask-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .ask-kicker {
      color: #17685e;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 4px;
    }

    .ask-question {
      font-size: 14px;
      font-weight: 850;
      line-height: 1.35;
    }

    .choice-grid {
      display: grid;
      gap: 7px;
    }

    .choice-card {
      text-align: left;
      display: grid;
      grid-template-columns: auto minmax(128px, 0.38fr) minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }

    .choice-card:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      box-shadow: 0 8px 18px rgba(38,52,77,0.08);
    }

    .choice-card.selected {
      border-color: var(--brand);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(31,122,109,0.12);
    }

    .choice-card strong {
      font-size: 13px;
      line-height: 1.3;
    }

    .choice-card span:last-child {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.42;
    }

    .ask-note {
      display: grid;
      gap: 6px;
    }

    .ask-note label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 820;
    }

    .ask-note textarea {
      width: 100%;
      min-height: 68px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: 0;
      padding: 9px;
      line-height: 1.45;
    }

    .ask-result {
      border-top: 1px solid #cfe7e1;
      padding-top: 10px;
      color: #17685e;
      font-size: 12px;
      font-weight: 760;
      line-height: 1.45;
    }

    .codex-live {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 13px;
      display: grid;
      gap: 12px;
    }

    .codex-lines {
      display: grid;
      gap: 7px;
    }

    .codex-line {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .codex-line:before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--brand);
      display: inline-block;
      margin-right: 8px;
      box-shadow: 0 0 0 4px rgba(31,122,109,0.10);
    }

    .inline-result {
      display: grid;
      gap: 12px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      min-height: 36px;
      border-radius: 8px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      box-shadow: 0 8px 18px rgba(38,52,77,0.08);
    }

    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 10px 22px rgba(31,122,109,0.20);
    }

    .btn.blue {
      background: var(--brand-2);
      border-color: var(--brand-2);
      color: #fff;
    }

    .btn.ghost {
      background: transparent;
    }

    .btn.danger {
      color: var(--danger);
      border-color: #efc4bd;
      background: #fff7f5;
    }

    .progress-card {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    .step {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 8px;
    }

    .step-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
    }

    .step.done .step-icon {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .step.running .step-icon {
      color: var(--brand);
      border-color: #9bd0c8;
      animation: pulse 1.1s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(31,122,109,0.18); }
      50% { box-shadow: 0 0 0 6px rgba(31,122,109,0.06); }
    }

    .step-title {
      font-size: 13px;
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .step-note {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 13px 0;
    }

    .metric {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      padding: 11px;
      min-width: 0;
      text-align: left;
    }

    .metric.detail-trigger,
    .chart-wrap.detail-trigger {
      cursor: pointer;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .metric.detail-trigger:hover,
    .chart-wrap.detail-trigger:hover {
      border-color: var(--line-strong);
      box-shadow: 0 8px 18px rgba(38,52,77,0.08);
      transform: translateY(-1px);
    }

    .metric-value {
      font-size: clamp(18px, 2.4vw, 26px);
      line-height: 1.1;
      font-weight: 880;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .metric-value.good {
      color: var(--good);
    }

    .metric-value.bad {
      color: var(--danger);
    }

    .metric-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-top: 6px;
      line-height: 1.35;
    }

    .chart-wrap {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px;
      margin-top: 12px;
      min-width: 0;
    }

    .chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 820;
      overflow-wrap: anywhere;
    }

    .chart-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini-tab {
      min-height: 30px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 12px;
      font-weight: 760;
    }

    .mini-tab.active {
      color: #fff;
      background: var(--brand-2);
      border-color: var(--brand-2);
    }

    canvas {
      display: block;
      width: 100%;
      height: 230px;
    }

    .explain {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    details {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      padding: 10px 12px;
    }

    details + details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      outline: 0;
    }

    .detail-list {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 8px;
    }

    .data-table th,
    .data-table td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    .data-table th {
      color: var(--muted);
      font-weight: 800;
      background: var(--panel-soft);
      white-space: nowrap;
    }

    .data-table td {
      overflow-wrap: anywhere;
    }

    .insight {
      background: rgba(255,255,255,0.42);
      border-left: 1px solid var(--line);
      padding: 18px 14px;
      overflow: auto;
      height: 100vh;
      position: sticky;
      top: 0;
      backdrop-filter: blur(16px);
    }

    .detail-empty {
      min-height: 100%;
    }

    .panel-stack {
      display: grid;
      gap: 12px;
    }

    .side-panel {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.94);
      border-radius: 8px;
      padding: 13px;
      box-shadow: 0 8px 20px rgba(38,52,77,0.05);
    }

    .panel-title {
      font-size: 13px;
      font-weight: 850;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .snapshot-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .snapshot-cell {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 8px;
      padding: 9px;
      min-width: 0;
    }

    .watch-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .watch-row:last-child {
      border-bottom: 0;
    }

    .watch-name {
      font-size: 13px;
      font-weight: 780;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .price {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .change {
      min-width: 58px;
      text-align: right;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .change.up {
      color: var(--good);
    }

    .change.down {
      color: var(--danger);
    }

    .param-grid {
      display: grid;
      gap: 9px;
    }

    .param-field {
      display: grid;
      gap: 5px;
    }

    .param-field label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
    }

    .param-grid input,
    .param-grid select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 9px;
      background: #fff;
      color: var(--ink);
      outline: 0;
    }

    .range-line {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    input[type="range"] {
      accent-color: var(--brand);
      width: 100%;
    }

    .version-list {
      display: grid;
      gap: 8px;
    }

    .version-card {
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 9px;
      background: var(--panel-soft);
    }

    .version-card.active {
      border-color: #b9ded6;
      background: #eef8f5;
    }

    .version-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .version-title {
      font-size: 12px;
      font-weight: 820;
    }

    .version-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .input-dock {
      position: fixed;
      left: var(--sidebar);
      right: var(--insight);
      bottom: 0;
      padding: 16px 20px 18px;
      background: linear-gradient(180deg, rgba(245,247,251,0), rgba(245,247,251,0.96) 26%, rgba(245,247,251,1));
      z-index: 8;
    }

    .input-shell {
      width: min(900px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 10px;
    }

    .input-shell textarea {
      border: 0;
      resize: none;
      min-height: 54px;
      max-height: 130px;
      padding: 8px 8px 0;
      box-shadow: none;
      line-height: 1.45;
    }

    .input-shell textarea:focus {
      box-shadow: none;
    }

    .prompt-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 1px 0 8px;
    }

    .prompt-chip {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .input-meta {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 112px;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 13px;
      font-weight: 760;
      box-shadow: var(--shadow);
      z-index: 20;
      transition: opacity .22s ease, transform .22s ease;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .drawer-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(23,32,51,0.32);
      z-index: 30;
    }

    .result-message {
      display: none;
    }

    .result-message.visible {
      display: grid;
    }

    .mobile-only {
      display: none;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .insight {
        display: none;
      }

      .input-dock {
        right: 0;
      }

      .result-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .app {
        display: block;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(86vw, 320px);
        height: 100vh;
        z-index: 40;
        transform: translateX(-104%);
        transition: transform .22s ease;
        box-shadow: var(--shadow);
      }

      body.drawer-open .sidebar {
        transform: translateX(0);
      }

      body.drawer-open .drawer-scrim {
        display: block;
      }

      .main {
        min-height: 100vh;
        max-height: none;
      }

      .topbar {
        padding: 12px;
      }

      .mobile-menu {
        display: grid;
        flex: 0 0 auto;
      }

      .page-title {
        font-size: 16px;
      }

      .topbar .status-pill {
        display: none;
      }

      .chat-scroll {
        padding: 16px 12px 224px;
        overflow: visible;
      }

      .message {
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 9px;
      }

      .avatar {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }

      .bubble {
        padding: 12px;
      }

      .assumption-grid,
      .choice-grid,
      .snapshot-grid {
        grid-template-columns: 1fr;
      }

      .assumption,
      .choice-card {
        grid-template-columns: 1fr;
      }

      .result-grid {
        grid-template-columns: 1fr 1fr;
      }

      .step {
        grid-template-columns: 26px minmax(0, 1fr);
      }

      .step-note {
        grid-column: 2;
        white-space: normal;
      }

      .data-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      canvas {
        height: 205px;
      }

      .input-dock {
        left: 0;
        right: 0;
        padding: 10px 10px 12px;
      }

      .input-meta {
        display: none;
      }

      .mobile-only {
        display: inline-flex;
      }
    }

    @media (max-width: 520px) {
      .result-grid {
        grid-template-columns: 1fr;
      }

      .chart-toolbar,
      .bubble-head,
      .input-actions {
        align-items: stretch;
      }

      .chart-tabs,
      .action-row {
        width: 100%;
      }

      .btn,
      .mini-tab {
        flex: 1 1 auto;
      }

      .prompt-row {
        padding-bottom: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="drawer-scrim" id="drawerScrim"></div>
  <div class="app">
    <aside class="sidebar" aria-label="历史会话">
      <div class="brand-row">
        <div class="logo">
          <div class="logo-mark">CQ</div>
          <div>
            <div class="logo-title">Chat-Quant</div>
            <div class="logo-subtitle">股票分析智能体</div>
          </div>
        </div>
        <button class="icon-btn mobile-only" id="closeDrawer" aria-label="关闭历史">×</button>
      </div>

      <button class="new-chat" id="newChatBtn">＋ 新建会话</button>

      <div class="conversation-count" id="sessionCount">最近会话</div>
      <div class="session-list" id="sessionList"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="openDrawer" aria-label="打开历史">☰</button>
        <div class="title-block">
          <h1 class="page-title" id="sessionTitle">沪深300 均线突破回测</h1>
          <div class="page-sub">
            <span>策略型历史会话</span>
            <span>自动保存于 17:42</span>
            <span>数据口径：延迟行情 + 历史日线</span>
          </div>
        </div>
        <div class="status-pill"><span class="dot"></span> 已连接数据与回测引擎</div>
      </header>

      <section class="chat-scroll" id="chatScroll">
        <div class="thread" id="thread"></div>
      </section>

      <div class="input-dock">
        <div class="input-shell">
          <div class="prompt-row">
            <button class="prompt-chip" data-prompt="把这个策略改成更稳一点，减少震荡期交易">更稳一点</button>
            <button class="prompt-chip" data-prompt="对比 AAPL 和 MSFT 最近三个月表现">股票对比</button>
            <button class="prompt-chip" data-prompt="帮我选出近期强势且估值合理的 A 股候选">选股辅助</button>
            <button class="prompt-chip" data-prompt="解释为什么 2025 年下半年回撤扩大">解释回撤</button>
          </div>
          <textarea id="chatInput" rows="2" placeholder="输入股票问题、选股条件或策略想法，例如：用贵州茅台回测 RSI 反转策略"></textarea>
          <div class="input-actions">
            <div class="input-meta">支持连续追问，当前上下文会自动带入策略参数和图表结果</div>
            <button class="btn primary" id="sendBtn">发送</button>
          </div>
        </div>
      </div>
    </main>

    <aside class="insight" aria-label="对象详情">
      <div class="detail-empty" id="detailEmpty"></div>
      <div class="panel-stack" id="detailPanel" hidden></div>
    </aside>
  </div>

  <div class="toast" id="toast">已更新</div>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const esc = (text) => String(text).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));

    const sessions = [
      ["ma", "沪深300 均线突破回测", "17:42", "策略型历史会话，年化 18.6%，最大回撤 -12.8%。", "equity"],
      ["aapl", "AAPL 与 MSFT 三个月表现对比", "15:18", "AAPL 回撤更小，MSFT 上行弹性更强。", "compare"],
      ["screen", "近期强势且估值合理候选池", "昨天", "A 股筛选结果，保留 12 只候选。", "trend"],
      ["rsi", "创业板 RSI 超卖反转策略", "7月22日", "策略回撤偏高，建议加入趋势过滤。", "drawdown"]
    ];
    const toolCalls = ["读取上下文", "调用平台命令", "整理产物", "生成回复"];
    const charts = {
      equity: ["策略收益曲线与沪深300基准", [["策略", "#1f7a6d", [100,109,116,132,141,149,174,203,216,254]], ["沪深300", "#2451a6", [100,103,106,115,118,120,135,146,151,168]]]],
      drawdown: ["最大回撤与恢复区间", [["策略回撤", "#c0392b", [0,-1,-3,-8,-6,-9,-3,-2,-8,0]], ["基准回撤", "#ad6a00", [0,-3,-5,-9,-10,-12,-9,-8,-13,-3]]]],
      compare: ["策略、指数与等权股票池对比", [["策略", "#1f7a6d", [100,107,116,129,138,152,167,182,203,235]], ["等权股票池", "#c26a2d", [100,105,109,116,121,124,137,146,151,171]], ["沪深300", "#2451a6", [100,103,106,115,118,120,135,146,151,168]]]],
      trend: ["沪深300价格趋势与均线信号", [["价格", "#2451a6", [3820,3905,3950,4050,4086,4090,4212,4265,4290,4415]], ["MA60", "#1f7a6d", [3780,3830,3884,3948,4004,4056,4114,4168,4218,4294]]]]
    };

    let messages = [];
    let activeChart = "equity";
    let versionNumber = 2;
    let rerunCount = 0;
    let runningTimers = [];
    const strategyParams = { shortMa: 20, longMa: 60, volatility: 1 };

    function makeId(prefix = "m") {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function nowTime() {
      return "刚刚";
    }

    function showToast(text) {
      $("#toast").textContent = text;
      $("#toast").classList.add("show");
      window.setTimeout(() => $("#toast").classList.remove("show"), 1800);
    }

    function scrollToBottom() {
      $("#chatScroll").scrollTop = $("#chatScroll").scrollHeight;
    }

    function renderSessions() {
      $("#sessionCount").textContent = `最近会话 · ${sessions.length}`;
      $("#sessionList").innerHTML = sessions.map(([id, title, time, snippet]) => `
        <button class="session-item ${id === "ma" ? "active" : ""}" data-session="${id}">
          <div class="session-primary"><div class="session-title">${title}</div><div class="session-time">${time}</div></div>
          <div class="session-snippet">${snippet}</div>
        </button>
      `).join("");
    }

    function addMessage(message) {
      messages.push({ id: makeId(message.type || "msg"), time: nowTime(), ...message });
      renderConversation();
      return messages[messages.length - 1];
    }

    function updateMessage(id, patch) {
      const message = messages.find((item) => item.id === id);
      if (!message) return;
      Object.assign(message, patch);
      renderConversation();
    }

    function renderConversation() {
      $("#thread").innerHTML = messages.map(renderMessage).join("");
      redrawVisibleCharts();
      scrollToBottom();
    }

    function renderMessage(message) {
      const role = message.role || "assistant";
      return `
        <article class="message ${role}" data-message-id="${message.id}">
          <div class="avatar">${role === "user" ? "我" : "AI"}</div>
          <div class="bubble">
            <div class="bubble-head">
              <div>
                <div class="bubble-title">${esc(message.title)}</div>
                ${renderTags(message.tags)}
              </div>
              <div class="bubble-time">${message.time}</div>
            </div>
            ${renderMessageBody(message)}
          </div>
        </article>
      `;
    }

    function renderTags(tags = []) {
      if (!tags.length) return "";
      return `<div class="tiny-row" style="margin-top:8px">${tags.map((tag) => `<span class="tag ${tag.className || ""}">${esc(tag.label)}</span>`).join("")}</div>`;
    }

    function renderMessageBody(message) {
      if (message.type === "tool") return renderToolMessage(message);
      if (message.type === "result") return renderResultMessage(message);
      return `<p>${esc(message.content)}</p>`;
    }

    function renderToolMessage(message) {
      return `
        <div class="codex-live">
            <div class="codex-lines"><div class="codex-line">${esc(message.statusLine || "正在模拟工具调用记录。")}</div></div>
          <div class="progress-card">
            ${toolCalls.map((title, index) => {
              const state = index < message.doneCount ? "done" : index === message.runningIndex ? "running" : "";
              const icon = index < message.doneCount ? "✓" : index + 1;
              const text = index < message.doneCount ? "已记录" : index === message.runningIndex ? "处理中" : "待触发";
              return `<div class="step ${state}"><div class="step-icon">${icon}</div><div class="step-title">${title}</div><div class="step-note">${text}</div></div>`;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderResultMessage(message) {
      const canvasId = `chart-${message.id}`;
      return `
        <div class="inline-result">
          <p>${esc(message.summary)}</p>
          <div class="result-grid">
            <button class="metric detail-trigger" type="button" data-action="detail" data-detail="strategy" data-result-id="${message.id}">
              <div class="metric-value good">${message.metrics.annual}</div><div class="metric-label">策略年化收益</div>
            </button>
            <div class="metric"><div class="metric-value bad">${message.metrics.drawdown}</div><div class="metric-label">最大回撤</div></div>
            <div class="metric"><div class="metric-value">${message.metrics.sharpe}</div><div class="metric-label">夏普比率</div></div>
            <div class="metric"><div class="metric-value">${message.metrics.win}</div><div class="metric-label">交易胜率</div></div>
          </div>
          <div class="chart-wrap detail-trigger" data-action="detail" data-detail="chart" data-result-id="${message.id}" role="button" tabindex="0">
            <div class="chart-toolbar">
              <div class="chart-title"><span id="title-${canvasId}">${esc(charts[message.chart][0])}</span><span class="tag">图表对象</span></div>
              <div class="chart-tabs">
                ${["equity", "drawdown", "compare", "trend"].map((chart) => `<button class="mini-tab ${message.chart === chart ? "active" : ""}" data-action="chart" data-result-id="${message.id}" data-chart="${chart}">${chartLabel(chart)}</button>`).join("")}
              </div>
            </div>
            <canvas id="${canvasId}" width="900" height="260" aria-label="股票图表"></canvas>
          </div>
          <div class="action-row">
            <button class="btn primary" data-action="rerun">再次回测</button>
            <button class="btn blue" data-action="stabilize">改成更稳一点</button>
            <button class="btn" data-action="copy">复制策略摘要</button>
          </div>
        </div>
      `;
    }

    function chartLabel(type) {
      return ({ equity: "收益", drawdown: "回撤", compare: "对比", trend: "行情" })[type] || type;
    }

    function redrawVisibleCharts() {
      messages.filter((message) => message.type === "result").forEach((message) => {
        drawChart(`chart-${message.id}`, `title-chart-${message.id}`, message.chart);
      });
    }

    function drawChart(canvasId, titleId, type = activeChart) {
      activeChart = type;
      const [title, series] = charts[type];
      const canvas = document.getElementById(canvasId);
      const titleNode = document.getElementById(titleId);
      if (!canvas) return;
      if (titleNode) titleNode.textContent = title;
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || 600;
      const height = rect.height || 230;
      const pad = { left: 42, right: 18, top: 18, bottom: 34 };
      const all = series.flatMap((item) => item[2]);
      const min = Math.min(...all);
      const spread = Math.max(...all) - min || 1;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#e6ebf2";
      ctx.fillStyle = "#7a8495";
      ctx.font = "11px Inter, sans-serif";
      for (let i = 0; i <= 4; i += 1) {
        const y = pad.top + (height - pad.top - pad.bottom) * i / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
      }
      series.forEach(([name, color, values], idx) => {
        ctx.beginPath();
        values.forEach((value, i) => {
          const x = pad.left + (width - pad.left - pad.right) * i / (values.length - 1);
          const y = pad.top + (height - pad.top - pad.bottom) * (1 - (value - min) / spread);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.6;
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.fillRect(pad.left + idx * 120, height - 20, 12, 3);
        ctx.fillStyle = "#475467";
        ctx.fillText(name, pad.left + idx * 120 + 18, height - 15);
      });
    }

    function clearRunTimers() {
      runningTimers.forEach((timer) => window.clearTimeout(timer));
      runningTimers = [];
    }

    function simulateToolRun({ statusLine, resultTitle, resultKind = "backtest", chart = "equity" }) {
      clearRunTimers();
      const toolMessage = addMessage({
        role: "assistant",
        type: "tool",
        title: "工具调用",
        tags: [{ label: "Codex 风格" }, { label: "原型模拟", className: "strategy" }],
        statusLine,
        runningIndex: 0,
        doneCount: 0
      });

      toolCalls.forEach((_, index) => {
        runningTimers.push(window.setTimeout(() => {
          updateMessage(toolMessage.id, { runningIndex: index, doneCount: index });
        }, 360 + index * 460));
        runningTimers.push(window.setTimeout(() => {
          updateMessage(toolMessage.id, { runningIndex: index + 1 < toolCalls.length ? index + 1 : -1, doneCount: index + 1 });
        }, 720 + index * 460));
      });
      runningTimers.push(window.setTimeout(() => addResultMessage(resultTitle, resultKind, chart), 2650));
    }

    function addResultMessage(title, resultKind, chart) {
      const metrics = makeMetrics();
      const summary = resultKind === "compare"
        ? "对比完成：AAPL 的回撤控制更好，MSFT 的上行弹性略强。图表中保留收益对比和波动差异，方便继续追问。"
        : resultKind === "screen"
          ? "筛选完成：候选池保留 12 只标的，强势因子和估值分位都已放在结果对象里，可继续要求收紧条件。"
          : `回测完成：MA ${strategyParams.shortMa}/${strategyParams.longMa}，策略收益高于指数，但震荡期仍需降低换手。`;
      addMessage({
        role: "assistant",
        type: "result",
        title,
        tags: [{ label: resultKind === "backtest" ? "策略回测" : "股票分析", className: "strategy" }, { label: "图表结果", className: "compare" }],
        summary,
        metrics,
        chart
      });
      showToast("结果已作为对话消息展示");
    }

    function makeMetrics() {
      const { shortMa, longMa, volatility } = strategyParams;
      const annual = (17.4 + volatility * 1.6 + rerunCount * 0.8 + (longMa - shortMa) / 120).toFixed(1);
      const drawdown = (-14.2 + volatility * 2.1 + rerunCount * 0.5).toFixed(1);
      const sharpe = (1.08 + volatility * 0.13 + rerunCount * 0.04).toFixed(2);
      const win = (51.8 + volatility * 1.3 + rerunCount * 0.5).toFixed(1);
      return { annual: `${annual}%`, drawdown: `${drawdown}%`, sharpe, win: `${win}%` };
    }

    function showDetail(type, resultId) {
      const result = messages.find((message) => message.id === resultId && message.type === "result") || messages.find((message) => message.type === "result");
      if (!result) return;
      $("#detailEmpty").hidden = true;
      $("#detailPanel").hidden = false;
      if (type === "chart") {
        $("#detailPanel").innerHTML = `
          <section class="side-panel">
            <div class="panel-title"><span>图表对象</span><span class="tag compare">${esc(charts[result.chart][0])}</span></div>
            <div class="snapshot-grid">
              <div class="snapshot-cell"><div class="label">当前视图</div><div class="value">${esc(result.chart)}</div></div>
              <div class="snapshot-cell"><div class="label">周期</div><div class="value">日线 · 近三年</div></div>
              <div class="snapshot-cell"><div class="label">叠加指标</div><div class="value">价格、收益、回撤</div></div>
              <div class="snapshot-cell"><div class="label">数据口径</div><div class="value">原型模拟数据</div></div>
            </div>
          </section>
        `;
        return;
      }
      $("#detailPanel").innerHTML = `
        <section class="side-panel">
          <div class="panel-title"><span>结果对象详情</span><span class="tag strategy">V${versionNumber}</span></div>
          <div class="snapshot-grid">
            <div class="snapshot-cell"><div class="label">策略逻辑</div><div class="value">MA ${strategyParams.shortMa}/${strategyParams.longMa} 突破</div></div>
            <div class="snapshot-cell"><div class="label">波动过滤</div><div class="value">${["关闭", "中等", "较强"][strategyParams.volatility]}</div></div>
            <div class="snapshot-cell"><div class="label">年化收益</div><div class="value">${result.metrics.annual}</div></div>
            <div class="snapshot-cell"><div class="label">最大回撤</div><div class="value">${result.metrics.drawdown}</div></div>
          </div>
          <div class="action-row"><button class="btn primary" data-side-action="rerun">再次回测</button></div>
        </section>
      `;
    }

    function inferPrompt(content) {
      const isCompare = /对比|AAPL|MSFT|比较/.test(content);
      const isScreen = /选股|候选|筛选/.test(content);
      const isStable = /稳|优化|减少|震荡/.test(content);
      const isRerun = /再次|回测|策略/.test(content);
      if (isStable) {
        strategyParams.shortMa = 25;
        strategyParams.longMa = 80;
        strategyParams.volatility = 2;
        rerunCount += 1;
        versionNumber += 1;
        return { statusLine: "正在根据会话目标选择平台命令并记录结果。", title: `V${versionNumber} 回测完成`, kind: "backtest", chart: "drawdown" };
      }
      if (isCompare) return { statusLine: "正在根据对比目标选择查询和图表命令。", title: "股票对比分析", kind: "compare", chart: "compare" };
      if (isScreen) return { statusLine: "正在根据选股目标选择查询和表格产物命令。", title: "候选池筛选结果", kind: "screen", chart: "trend" };
      if (isRerun) {
        rerunCount += 1;
        versionNumber += 1;
        return { statusLine: "正在根据当前策略资产选择回测命令。", title: `V${versionNumber} 回测完成`, kind: "backtest", chart: "equity" };
      }
      return { statusLine: "正在读取当前会话上下文并选择可用平台命令。", title: "上下文解释", kind: "backtest", chart: activeChart };
    }

    function sendUserPrompt(text, echo = true) {
      const content = text.trim();
      if (!content) return;
      if (echo) addMessage({ role: "user", type: "text", title: "用户", content });
      $("#chatInput").value = "";
      const next = inferPrompt(content);
      simulateToolRun({ statusLine: next.statusLine, resultTitle: next.title, resultKind: next.kind, chart: next.chart });
    }

    function loadSession(id) {
      clearRunTimers();
      const session = sessions.find(item => item[0] === id) || sessions[0];
      $("#sessionTitle").textContent = session[1];
      $$(".session-item").forEach(item => item.classList.toggle("active", item.dataset.session === id));
      messages = [
        { id: makeId("u"), role: "user", type: "text", title: "用户", content: session[1], time: session[2] },
        { id: makeId("r"), role: "assistant", type: "result", title: session[1], tags: [{ label: "历史会话", className: "strategy" }], summary: session[3], metrics: makeMetrics(), chart: session[4], time: session[2] }
      ];
      renderConversation();
      showToast(`已打开：${session[1]}`);
      document.body.classList.remove("drawer-open");
    }

    function resetConversation() {
      clearRunTimers();
      messages = [];
      addMessage({
        role: "user",
        type: "text",
        title: "用户目标",
        content: "帮我创建一个均线突破策略，用沪深300成分股回测近三年，看看是否比指数更稳。",
        time: "17:39"
      });
      addMessage({
        role: "assistant",
        type: "text",
        title: "目标理解",
        tags: [{ label: "策略创建", className: "strategy" }, { label: "回测验证" }],
        content: "我会根据当前目标选择可用的平台命令，并把工具调用记录、图表或策略资产沉淀到会话中。",
        time: "17:39"
      });
      simulateToolRun({ statusLine: "正在根据策略目标选择数据、策略和回测命令。", resultTitle: "策略回测结果", resultKind: "backtest", chart: "equity" });
    }

    function bindEvents() {
      $("#thread").addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "chart") {
          const result = messages.find((message) => message.id === target.dataset.resultId);
          if (result) {
            result.chart = target.dataset.chart;
            renderConversation();
          }
        }
        if (action === "detail") showDetail(target.dataset.detail, target.dataset.resultId);
        if (action === "rerun") sendUserPrompt("再次回测这个策略");
        if (action === "stabilize") sendUserPrompt("把这个策略改成更稳一点，减少震荡期交易");
        if (action === "copy") showToast("策略摘要已复制到剪贴板模拟区");
      });
      $("#thread").addEventListener("keydown", (event) => {
        const target = event.target.closest("[data-action='detail']");
        if (target && (event.key === "Enter" || event.key === " ")) showDetail(target.dataset.detail, target.dataset.resultId);
      });
      $("#detailPanel").addEventListener("click", (event) => {
        if (event.target.closest("[data-side-action='rerun']")) sendUserPrompt("再次回测这个策略");
      });
      $("#sessionList").addEventListener("click", (event) => {
        const item = event.target.closest(".session-item");
        if (item) loadSession(item.dataset.session);
      });
      $("#sendBtn").addEventListener("click", () => sendUserPrompt($("#chatInput").value));
      $("#chatInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendUserPrompt($("#chatInput").value);
        }
      });
      $$(".prompt-chip").forEach(btn => btn.addEventListener("click", () => {
        $("#chatInput").value = btn.dataset.prompt;
        $("#chatInput").focus();
      }));
      $("#openDrawer").addEventListener("click", () => document.body.classList.add("drawer-open"));
      $("#closeDrawer").addEventListener("click", () => document.body.classList.remove("drawer-open"));
      $("#drawerScrim").addEventListener("click", () => document.body.classList.remove("drawer-open"));
      $("#newChatBtn").addEventListener("click", () => {
        clearRunTimers();
        $("#sessionTitle").textContent = "新的股票分析会话";
        messages = [];
        addMessage({ role: "assistant", type: "text", title: "新的会话已准备好", content: "可以直接输入股票走势查询、选股条件或策略回测想法。" });
        document.body.classList.remove("drawer-open");
      });
      window.addEventListener("resize", redrawVisibleCharts);
    }

    window.addEventListener("load", () => {
      renderSessions();
      bindEvents();
      resetConversation();
    });
  </script>
</body>
</html>
