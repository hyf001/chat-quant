[project]
name = "chat-quant-api"
version = "0.1.0"
description = "FastAPI backend for Chat-Quant"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "akshare>=1.18.78",
  "backtrader>=1.9.78.123",
  "claude-agent-sdk>=0.2.127",
  "duckdb>=1.3.0",
  "fastapi>=0.116.1",
  "greenlet>=3.2.4",
  "ipykernel>=6.30.0",
  "matplotlib>=3.10.0",
  "notebook>=7.4.0",
  "numpy>=2.3.0",
  "pandas>=2.3.0",
  "scikit-learn>=1.7.0",
  "socksio>=1.0.0",
  "sqlalchemy>=2.0.51",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pyinstaller>=6.11.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
