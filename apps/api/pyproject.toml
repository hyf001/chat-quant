[project]
name = "chat-quant-api"
version = "0.1.0"
description = "FastAPI backend for Chat-Quant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "pydantic-settings>=2.10.1",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
chatq = "app.cli.main:main"
